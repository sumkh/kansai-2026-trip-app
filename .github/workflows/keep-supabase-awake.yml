name: Keep Supabase awake

# Supabase free-tier projects pause after 7 days of inactivity. Unpausing loses
# no data and takes one click — but not at Changi at 1am on 19 September.
#
# This runs entirely outside the application. It does not touch Render, adds no
# route, no dependency and no runtime cost, and cannot affect the app even if it
# fails. It also needs NO secrets: the URL and publishable key it reads from the
# repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY are public
# by design — the key ships inside the browser bundle, and RLS returns nothing
# to an unauthenticated caller. Verified: this request returns `[]`, not data.
#
# Daily rather than weekly on purpose. GitHub's scheduled runs are best-effort
# and can be delayed under load, so a 7-day deadline wants more than one
# attempt of margin. A run costs about 15 seconds of the free monthly minutes.

#
# The trip is over and the schedule is switched off. To use it for a live
# deployment, set the two repository variables and restore:
#   schedule:
#     - cron: '0 2 * * *' # 02:00 UTC — 11:00 JST, well away from any deploy

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          # A real SELECT through PostgREST, which is what counts as activity.
          # RLS filters every row, so the response is an empty array.
          status=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/days?select=id&limit=1" \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $PUBLISHABLE_KEY")

          echo "HTTP $status"
          echo "body: $(cat /tmp/body)"

          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer with 200. The project may be paused, or the schema has changed."
            exit 1
          fi

          # A 200 with anything other than [] would mean RLS is no longer
          # filtering anonymous reads, which is worth failing loudly over.
          if [ "$(cat /tmp/body)" != "[]" ]; then
            echo "::error::Anonymous read returned data. RLS is not filtering — investigate immediately."
            exit 1
          fi

          echo "Database is awake and RLS is holding."
